[build-system]
# >=78.1.1, not >=68: several PYSEC advisories affect the 68.x line
# (PYSEC-2025-49 among them, fixed in 78.1.1). Build-time only -- nothing
# here ships to an installed environment -- but the floor costs one line
# and there is no reason to build with a known-vulnerable version.
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ora2pg-gap-report"
version = "0.10.0"
description = "Detectors that find Oracle → PostgreSQL migration gaps ora2pg misses or converts incorrectly, each verified against real ora2pg and PostgreSQL runs."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Lunch418" }]
keywords = ["oracle", "postgresql", "ora2pg", "migration", "plsql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Environment :: Console",
]
requires-python = ">=3.10"
# rich — единственная обязательная зависимость, только для терминального
# вывода CLI (ora2pg_gap_report/terminal_report.py, cli.py). Сама
# детекторная библиотека (models.py, detectors/, report_generator.py)
# от неё не зависит и её не импортирует.
# Upper bound for the same reason ruff carries one (see [tool.ruff.lint]'s
# own comment): this tool promises reproducible output and ships as an
# offline bundle, so a major bump arriving silently on someone's next
# `pip install` is a real risk, not a hypothetical. rich's major versions
# have changed table/panel rendering before, and the terminal report is
# a documented artifact here. Tested against 13.x-15.x; raise the ceiling
# deliberately, after checking the report still renders the same.
dependencies = ["rich>=13,<16"]

[project.optional-dependencies]
# Только для oracle_connector.py / oracle_export.py (живая выгрузка DDL из
# Oracle). Три детектора и сам анализ в этом не нуждаются вообще.
oracle = ["oracledb>=2.0"]
# Только для --tui (ora2pg_gap_report/tui_app.py) — мышь/клавиатура вместо
# флагов командной строки. Обычный CLI (весь остальной пакет) от этого не
# зависит и без этого extra продолжает работать как раньше — установка
# `textual` требуется только тем, кто явно хочет интерактивный режим.
# Ceiling for the same reason rich has one, and more urgently: Textual
# has a track record of breaking widget/CSS APIs across majors, and
# this app pins per-widget CSS widths and DataTable behaviour that a
# major bump has broken before. Tested against 1.x-8.x.
tui = ["textual>=1.0,<9"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.24", "ruff>=0.6,<0.17", "jsonschema>=4.0", "textual>=1.0,<9", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Lunch418/ora2pg-gap-report"
Documentation = "https://github.com/Lunch418/ora2pg-gap-report#readme"
Repository = "https://github.com/Lunch418/ora2pg-gap-report"
Changelog = "https://github.com/Lunch418/ora2pg-gap-report/blob/main/CHANGELOG.md"
Issues = "https://github.com/Lunch418/ora2pg-gap-report/issues"

[project.scripts]
ora2pg-gap-report = "ora2pg_gap_report.cli:main"
ora2pg-gap-export = "ora2pg_gap_report.oracle_export:main"

[tool.setuptools.packages.find]
include = ["ora2pg_gap_report*"]

[tool.pytest.ini_options]
# EncodingWarning as an error. Python only emits that warning when
# PYTHONWARNDEFAULTENCODING=1 is set before the interpreter starts (the
# tests workflow sets it, and `PYTHONWARNDEFAULTENCODING=1 pytest` does
# the same locally) -- it fires for every file opened without an explicit
# `encoding=`, which is exactly the bug that failed a dozen tests the
# first time this suite ever ran on Windows: the locale default there is
# cp1252, and it cannot decode this project's own UTF-8 output. Linux and
# macOS default to UTF-8, so nothing catches it on a developer's machine.
# Making it an error here means the CI run that does arm it fails loudly
# instead of printing a warning nobody reads.
filterwarnings = [
    "error::EncodingWarning",
]
# `-m ora2pg` selects the tests that need a real ora2pg binary on PATH.
# They are skipped when it isn't there rather than failing, so a
# developer without a Perl toolchain still gets a green suite -- the CI
# job that installs ora2pg is what makes them actually run. Registered
# here so an unregistered-marker warning never hides a typo'd marker.
markers = [
    "ora2pg: needs a real ora2pg binary on PATH (installed by the ora2pg CI job)",
]

[tool.ruff.lint]
# Explicit selection, not ruff's own implicit default -- that default has
# changed between minor versions (0.15's true default was E+F, ~59 rules;
# 0.16's is ~413 rules across dozens of plugin families: isort/I,
# flake8-comprehensions/C4, flake8-blind-except/BLE001, bugbear/B, and
# more), which would silently change what CI considers a lint failure on
# every ruff upgrade with no corresponding change in this repo. E4/E7/E9
# (a handful of real pycodestyle error classes) + F (pyflakes: unused
# imports/names, undefined names) is what's actually enforced here on
# purpose. The upper-bound in the `ruff` dev dependency (see
# [project.optional-dependencies]) pins the tool version alongside this
# selection -- belt and suspenders against the same class of drift.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Scoped to the package + scripts/, not tests/ -- test files lean on
# fixtures/monkeypatching/dynamic construction patterns that don't carry
# much of their own type-safety value, and checking them adds friction
# without a real payoff. disallow_untyped_defs is what actually makes
# this meaningful: without it mypy skips checking the *body* of any
# function that has no annotations at all, silently passing over
# whatever's inside. Every one of these was already true of the codebase
# as it stood (mypy needed zero `type: ignore`s to get here) -- this
# config just makes that a checked, CI-enforced fact instead of an
# unverified impression.
files = ["ora2pg_gap_report", "scripts"]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# A bare `dict`/`list`/`tuple` annotation is Any inside, so mypy checks
# nothing about what a container holds while the annotation reads as if
# it does. Turning this on found 26 of them; every one had a concrete
# answer that was simply never written down (the SARIF builders' dicts,
# the fixer tuples, the baseline records, Textual's Screen/App result
# types). None needed a `type: ignore` -- see disallow_untyped_defs
# above for the same reasoning about function bodies.
disallow_any_generics = true

# oracledb is a genuinely optional extra (see [project.optional-
# dependencies]'s own "oracle" group) -- oracle_connector.py/
# scripts/verify_against_live_oracle.py only reference its types under
# `if TYPE_CHECKING:`, exactly so this package stays importable without
# it installed. Not installed in CI's own dev environment either, so
# mypy must not hard-fail when it can't find it -- treated as Any there
# instead, real type checking against it whenever a dev happens to have
# `pip install ora2pg-gap-report[oracle]` in their own environment too.
[[tool.mypy.overrides]]
module = "oracledb"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ora2pg-gap-report"
version = "0.4.0"
description = "Сканер Oracle-схемы, дополняющий ora2pg: находит объекты, которые он не перенесёт или перенесёт некорректно, до начала миграции на Postgres Pro."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lunch418" }]
keywords = ["oracle", "postgresql", "ora2pg", "migration", "plsql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Environment :: Console",
]
requires-python = ">=3.10"
# rich — единственная обязательная зависимость, только для терминального
# вывода CLI (ora2pg_gap_report/terminal_report.py, cli.py). Сама
# детекторная библиотека (models.py, detectors/, report_generator.py)
# от неё не зависит и её не импортирует.
dependencies = ["rich>=13"]

[project.optional-dependencies]
# Только для oracle_connector.py / oracle_export.py (живая выгрузка DDL из
# Oracle). Три детектора и сам анализ в этом не нуждаются вообще.
oracle = ["oracledb>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.6,<0.17", "jsonschema>=4.0"]

[project.urls]
Repository = "https://github.com/Lunch418/ora2pg-gap-report"

[project.scripts]
ora2pg-gap-report = "ora2pg_gap_report.cli:main"
ora2pg-gap-export = "ora2pg_gap_report.oracle_export:main"

[tool.setuptools.packages.find]
include = ["ora2pg_gap_report*"]

[tool.ruff.lint]
# Explicit selection, not ruff's own implicit default -- that default has
# changed between minor versions (0.15's true default was E+F, ~59 rules;
# 0.16's is ~413 rules across dozens of plugin families: isort/I,
# flake8-comprehensions/C4, flake8-blind-except/BLE001, bugbear/B, and
# more), which would silently change what CI considers a lint failure on
# every ruff upgrade with no corresponding change in this repo. E4/E7/E9
# (a handful of real pycodestyle error classes) + F (pyflakes: unused
# imports/names, undefined names) is what's actually enforced here on
# purpose. The upper-bound in the `ruff` dev dependency (see
# [project.optional-dependencies]) pins the tool version alongside this
# selection -- belt and suspenders against the same class of drift.
select = ["E4", "E7", "E9", "F"]

name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check distribution metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) — no token stored in this repo
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  offline-bundle:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to attach the bundle to the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Base install only (no --oracle): oracledb ships platform-specific
      # wheels resolved for *this* runner, which won't necessarily match
      # every target machine's OS/arch/Python version. The base bundle
      # (rich + its pure-Python dependencies) has no such mismatch risk.
      # Anyone needing the oracle extra for a specific target platform
      # builds it themselves via scripts/build_offline_bundle.py --oracle
      # --platform/--python-version/--abi, per the script's own --help.
      - name: Build offline install bundle
        run: python scripts/build_offline_bundle.py

      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, not interpolated directly into the run: script
          # below — a git tag name can legally contain shell metacharacters
          # (", $, `, ;, |, &, (, ) — git-check-ref-format only forbids
          # control chars/space/~^:?*[/backslash/leading-trailing dot/@{),
          # so substituting ${{ github.event.release.tag_name }} straight
          # into the command line would let a maliciously crafted tag name
          # break out of the quotes and run arbitrary shell commands in a
          # job holding contents: write.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ora2pg-gap-report-offline.tar.gz --clobber

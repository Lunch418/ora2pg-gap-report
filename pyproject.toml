[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ora2pg-gap-report"
version = "0.9.0"
description = "Detectors that find Oracle → PostgreSQL migration gaps ora2pg misses or converts incorrectly, each verified against real ora2pg and PostgreSQL runs."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Lunch418" }]
keywords = ["oracle", "postgresql", "ora2pg", "migration", "plsql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Environment :: Console",
]
requires-python = ">=3.10"
# rich — единственная обязательная зависимость, только для терминального
# вывода CLI (ora2pg_gap_report/terminal_report.py, cli.py). Сама
# детекторная библиотека (models.py, detectors/, report_generator.py)
# от неё не зависит и её не импортирует.
dependencies = ["rich>=13"]

[project.optional-dependencies]
# Только для oracle_connector.py / oracle_export.py (живая выгрузка DDL из
# Oracle). Три детектора и сам анализ в этом не нуждаются вообще.
oracle = ["oracledb>=2.0"]
# Только для --tui (ora2pg_gap_report/tui_app.py) — мышь/клавиатура вместо
# флагов командной строки. Обычный CLI (весь остальной пакет) от этого не
# зависит и без этого extra продолжает работать как раньше — установка
# `textual` требуется только тем, кто явно хочет интерактивный режим.
tui = ["textual>=1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.24", "ruff>=0.6,<0.17", "jsonschema>=4.0", "textual>=1.0", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Lunch418/ora2pg-gap-report"
Documentation = "https://github.com/Lunch418/ora2pg-gap-report#readme"
Repository = "https://github.com/Lunch418/ora2pg-gap-report"
Changelog = "https://github.com/Lunch418/ora2pg-gap-report/blob/main/CHANGELOG.md"
Issues = "https://github.com/Lunch418/ora2pg-gap-report/issues"

[project.scripts]
ora2pg-gap-report = "ora2pg_gap_report.cli:main"
ora2pg-gap-export = "ora2pg_gap_report.oracle_export:main"

[tool.setuptools.packages.find]
include = ["ora2pg_gap_report*"]

[tool.ruff.lint]
# Explicit selection, not ruff's own implicit default -- that default has
# changed between minor versions (0.15's true default was E+F, ~59 rules;
# 0.16's is ~413 rules across dozens of plugin families: isort/I,
# flake8-comprehensions/C4, flake8-blind-except/BLE001, bugbear/B, and
# more), which would silently change what CI considers a lint failure on
# every ruff upgrade with no corresponding change in this repo. E4/E7/E9
# (a handful of real pycodestyle error classes) + F (pyflakes: unused
# imports/names, undefined names) is what's actually enforced here on
# purpose. The upper-bound in the `ruff` dev dependency (see
# [project.optional-dependencies]) pins the tool version alongside this
# selection -- belt and suspenders against the same class of drift.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Scoped to the package + scripts/, not tests/ -- test files lean on
# fixtures/monkeypatching/dynamic construction patterns that don't carry
# much of their own type-safety value, and checking them adds friction
# without a real payoff. disallow_untyped_defs is what actually makes
# this meaningful: without it mypy skips checking the *body* of any
# function that has no annotations at all, silently passing over
# whatever's inside. Every one of these was already true of the codebase
# as it stood (mypy needed zero `type: ignore`s to get here) -- this
# config just makes that a checked, CI-enforced fact instead of an
# unverified impression.
files = ["ora2pg_gap_report", "scripts"]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# oracledb is a genuinely optional extra (see [project.optional-
# dependencies]'s own "oracle" group) -- oracle_connector.py/
# scripts/verify_against_live_oracle.py only reference its types under
# `if TYPE_CHECKING:`, exactly so this package stays importable without
# it installed. Not installed in CI's own dev environment either, so
# mypy must not hard-fail when it can't find it -- treated as Any there
# instead, real type checking against it whenever a dev happens to have
# `pip install ora2pg-gap-report[oracle]` in their own environment too.
[[tool.mypy.overrides]]
module = "oracledb"
ignore_missing_imports = true

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check ora2pg_gap_report/ tests/

      - name: Run mypy
        run: mypy

      - name: Registry consistency check (research doc / detector / tests per GAP)
        run: python3 scripts/doctor.py

  pytest:
    runs-on: ${{ matrix.os }}
    # Every OS gates. This matrix was added non-gating because none of the
    # platform-specific surface here (path handling in baseline
    # group_key()s, atomic renames, subprocess decoding, the
    # .sql/.pks/.pkb suffix match that exists because Windows tooling
    # emits uppercase extensions) had ever actually been executed off
    # Linux. Its first run found 14 failures on Windows and 1 on macOS,
    # one of them a real bug in the tool; with those fixed and all three
    # platforms green, there is no reason to keep the results advisory.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One Python version each: the point is covering the OS, and
          # the Python-version axis is already covered above.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        # PYTHONWARNDEFAULTENCODING arms Python's EncodingWarning, which
        # pyproject's filterwarnings turns into an error: it fires on any
        # file opened without an explicit encoding=, the exact bug that
        # broke a dozen tests the first time this suite ran on Windows.
        # It has to be an environment variable -- the flag is read at
        # interpreter startup, before pytest's own config is loaded.
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: pytest -v

  ora2pg-integration:
    # The one job that runs the real thing. Everything else in this
    # workflow tests this project's code against ora2pg behaviour recorded
    # by hand; nothing checked that the recording still holds.
    # ora2pg_wrapper.py parses ora2pg's --estimate_cost output by matching
    # its exact comment wording, and a reworded release makes those
    # regexes match nothing rather than raise -- a silent zero that looks
    # exactly like a clean package. This job is what would catch that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ora2pg from source
        # Pinned to the version gap_registry.py records its findings
        # against -- tests/test_real_ora2pg.py asserts the two agree, so
        # bumping this without re-verifying the gaps fails loudly instead
        # of quietly testing the parsers against unreviewed output.
        # From source rather than apt: Ubuntu's package lags, and which
        # version ran is the whole point here.
        env:
          ORA2PG_VERSION: "25.0"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbi-perl
          curl -fsSL "https://github.com/darold/ora2pg/archive/refs/tags/v${ORA2PG_VERSION}.tar.gz" -o /tmp/ora2pg.tar.gz
          tar -xzf /tmp/ora2pg.tar.gz -C /tmp
          cd "/tmp/ora2pg-${ORA2PG_VERSION}"
          perl Makefile.PL
          make
          sudo make install
          ora2pg --version

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run the tests that need a real ora2pg
        # -m ora2pg alone would pass vacuously if every test were skipped
        # (a renamed marker, a broken install): --strict-markers catches
        # the first, and the explicit count check below catches the second.
        run: |
          set -euo pipefail
          pytest -v -m ora2pg --strict-markers | tee /tmp/ora2pg-tests.txt
          if grep -qE "([0-9]+ skipped|no tests ran)" /tmp/ora2pg-tests.txt; then
            echo "::error::the ora2pg tests were skipped -- ora2pg is not on PATH in this job"
            exit 1
          fi
          grep -qE "[0-9]+ passed" /tmp/ora2pg-tests.txt

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Install the built wheel into a fresh environment and smoke-test it
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install dist/*.whl
          /tmp/verify-venv/bin/ora2pg-gap-report --help
          /tmp/verify-venv/bin/ora2pg-gap-report --version
          /tmp/verify-venv/bin/ora2pg-gap-report docs/research/samples/logger.pkb --format json | python -c "import json,sys; d=json.load(sys.stdin); assert len(d) > 0, 'expected findings on a known-bad sample'; print(len(d), 'findings — ok')"
          /tmp/verify-venv/bin/ora2pg-gap-report docs/research/samples/ --format json | python -c "import json,sys; d=json.load(sys.stdin); assert len(d) > 0, 'expected findings scanning the samples directory'; print(len(d), 'findings from directory scan — ok')"
          COLUMNS=200 /tmp/verify-venv/bin/ora2pg-gap-report --explain GAP-023 | grep -q 'github.com.*gap-023-oracle-text.md' && echo '--explain falls back to a GitHub link in the installed wheel — ok'
          # textual isn't installed in this bare wheel (only via the [tui] extra) --
          # --tui must fail with a clean install hint, not a raw ImportError traceback.
          # --tui's own expected exit code (2) would otherwise get tangled up with
          # pipefail's exit-status resolution if piped straight into grep, so capture
          # it to a file with `set +e` around the one command that's allowed to fail.
          set +e
          /tmp/verify-venv/bin/ora2pg-gap-report --tui > /tmp/tui-error.txt 2>&1
          tui_exit=$?
          set -e
          if grep -q Traceback /tmp/tui-error.txt; then
            echo "::error::--tui crashed with a traceback instead of a clean error"
            cat /tmp/tui-error.txt
            exit 1
          fi
          if [ "$tui_exit" -ne 2 ]; then
            echo "::error::--tui without textual installed should exit 2, got $tui_exit"
            exit 1
          fi
          grep -q 'pip install' /tmp/tui-error.txt && echo '--tui gives a clean install hint without textual — ok'
